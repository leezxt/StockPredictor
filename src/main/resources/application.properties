# ── Application ─────────────────────────────────────────
spring.application.name=StockPredictor
server.port=${SERVER_PORT:19090}
stockpredictor.data-dir=${STOCKPREDICTOR_DATA_DIR:${user.home}/.stockpredictor}
stockpredictor.jdbc-url=${STOCKPREDICTOR_JDBC_URL:jdbc:h2:file:${stockpredictor.data-dir}/stockdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}

# ── H2 Web Console ──────────────────────────────────────
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── DataSource（應用程式唯一連線池）──────────────────────
spring.datasource.url=${stockpredictor.jdbc-url}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
# schema 統一由 Flyway 管理，不執行舊式 schema.sql
spring.sql.init.mode=never

# ── Flyway ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration/h2}
# 既有 H2 資料庫沒有 schema history，先標記為 version 0，再執行冪等的 V1。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ── JPA ─────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
spring.jpa.show-sql=false
# 關閉 Hibernate 自動掃描（表結構目前由 DatabaseSchemaInitializer 建立）
spring.jpa.open-in-view=false

# ── JSON 輸出 ────────────────────────────────────────────
spring.jackson.time-zone=Asia/Taipei
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.default-property-inclusion=non_null

# ── 編碼 ────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── 日誌等級 ─────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.gtalent=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{20} - %msg%n

# ── Spring Boot DevTools ─────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000

# ── 啟動體驗 ───────────────────────────────────────────
app.browser.auto-open=true
app.browser.host=127.0.0.1
app.browser.startup-delay-ms=1200

# ── FinMind API ─────────────────────────────────────────
finmind.api.token=${FINMIND_API_TOKEN:}
finmind.api.url=https://api.finmindtrade.com/api/v4/data
finmind.api.login.url=https://api.finmindtrade.com/api/v4/login
finmind.api.user-id=
finmind.api.password=
finmind.api.auto-login=true

# ── ETF NAV Fallback List ───────────────────────────────
# 以逗號分隔，依序嘗試；%s 會被替換成 ETF 代號（例如 0050）
twse.etf.nav.urls=https://www.twse.com.tw/rwd/zh/ETF/etfQuote?response=json&stockNo=%s,https://www.twse.com.tw/rwd/zh/ETF/etfDiv?response=json&stockNo=%s,https://www.tpex.org.tw/openapi/v1/tpex_etf_nav

