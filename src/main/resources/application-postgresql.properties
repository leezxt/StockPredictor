# ── PostgreSQL profile ───────────────────────────────────
# 啟用方式：SPRING_PROFILES_ACTIVE=postgresql
stockpredictor.jdbc-url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/stockpredictor}

spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/stockpredictor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:stockpredictor}
spring.datasource.password=${POSTGRES_PASSWORD:stockpredictor-local}

spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
